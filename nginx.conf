events {}

http {
  server {
    listen 80;
    server_name _;

    # 前端 H5 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # H5 单页应用：所有路径都回退到 index.html（支持前端路由）
    location / {
      try_files $uri $uri/ /index.html;
    }

    # 接口转发到后端
    # 这里用的是你 request.ts 里默认的生产地址域名
    location /api/ {
      proxy_pass https://wanhua5.sxjzlwxh.com/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}