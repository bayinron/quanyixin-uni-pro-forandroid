version: '3.8'

services:
  wanhua-h5:
    image: nginx:1.27-alpine          # 轻量 nginx 镜像
    container_name: wanhua-h5
    ports:
      - "8080:80"                     # 本机 8080 端口 -> 容器 80 端口
    volumes:
      # 把打包好的 H5 挂载到 nginx 默认静态目录
      - ./dist/build/h5:/usr/share/nginx/html:ro
      # 使用我们自己写的 nginx 配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro